name: srs_generator
description: СРС Генератор - Физика, Электроника, Математика, Информатика

publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.3
  file_picker: ^8.1.2
  shared_preferences: ^2.2.3
  open_file: ^3.3.2
  intl: ^0.19.0
  archive: ^4.0.0
  syncfusion_flutter_pdf: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/fonts/handwriting/
  fonts:
    - family: hw_caveat
      fonts:
        - asset: assets/fonts/handwriting/caveat.ttf
    - family: hw_badscript
      fonts:
        - asset: assets/fonts/handwriting/badscript.ttf
    - family: hw_pangolin
      fonts:
        - asset: assets/fonts/handwriting/pangolin.ttf
    - family: hw_shantell
      fonts:
        - asset: assets/fonts/handwriting/shantell.ttf
    - family: hw_playpen
      fonts:
        - asset: assets/fonts/handwriting/playpen.ttf
    - family: hw_pacifico
      fonts:
        - asset: assets/fonts/handwriting/pacifico.ttf
    - family: hw_marckkg
      fonts:
        - asset: assets/fonts/handwriting/marckscript_kg.ttf
